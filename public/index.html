<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup Fatal - Le Duel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        /* --- RESET & VARIABLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        :root {
            --primary: #00E676;
            /* Vert Fluo */
            --danger: #FF1744;
            /* Rouge Fluo */
            --warning: #FF9100;
            /* Orange Fluo */
            --info: #00B0FF;
            /* Bleu Fluo */
            --glass-bg: rgba(20, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            /* Arrière-plan stylé Esports / Sombre */
            background-color: #0b0c10;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 176, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 23, 68, 0.15), transparent 25%);
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- TYPOGRAPHIE --- */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #00B0FF, #00E676);
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.3));
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #c5c6c7;
            font-size: 1.5rem;
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* --- ANIMATIONS --- */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px var(--warning);
            }

            50% {
                box-shadow: 0 0 30px var(--warning);
            }

            100% {
                box-shadow: 0 0 15px var(--warning);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-10px);
            }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
            border-color: var(--danger) !important;
        }

        /* --- BOUTONS --- */
        .btn {
            padding: 15px 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(1);
        }

        .btn-lancer {
            background: linear-gradient(45deg, var(--info), #0044ff);
            box-shadow: 0 10px 20px rgba(0, 176, 255, 0.3);
            width: 100%;
            margin-top: 10px;
        }

        .btn-valider {
            background: linear-gradient(45deg, var(--primary), #00a152);
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.3);
        }

        .btn-skip {
            background: linear-gradient(45deg, var(--warning), #ff6d00);
            box-shadow: 0 10px 20px rgba(255, 145, 0, 0.3);
        }

        #btn-demarrer {
            background: linear-gradient(45deg, #d500f9, #651fff);
            font-size: 1.5rem;
            padding: 20px 50px;
            margin-bottom: 30px;
            animation: popIn 0.5s forwards, pulseGlow 2s infinite;
        }

        /* --- INPUTS --- */
        input[type="text"],
        select {
            padding: 18px 25px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 15px;
            border: 2px solid var(--glass-border);
            width: 100%;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--info);
            box-shadow: 0 0 20px rgba(0, 176, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* --- CONTAINERS GLASSMORPHISM --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 40px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #menu {
            width: 450px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #8a8d91;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- ZONE JEU --- */
        #zone-jeu {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
        }

        #nom-salon {
            color: var(--info);
            font-weight: 900;
            letter-spacing: 2px;
        }

        #messages {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--warning);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- CHRONOS (CARTES JOUEURS) --- */
        #chronos {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .chrono-player {
            background: var(--glass-bg);
            border-radius: 25px;
            padding: 25px;
            width: 320px;
            border: 2px solid var(--glass-border);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* État Actif = C'est son tour */
        .chrono-player.active-turn {
            border-color: var(--primary);
            transform: scale(1.08) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 230, 118, 0.2);
            background: rgba(0, 230, 118, 0.05);
            z-index: 10;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Avatar Généré */
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: white;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .is-me .avatar {
            background: linear-gradient(135deg, var(--info), #0044ff);
        }

        .is-adversary .avatar {
            background: linear-gradient(135deg, var(--danger), #b71c1c);
        }

        .player-info-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .player-name {
            font-weight: 900;
            font-size: 1.2rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .player-role {
            font-size: 0.8rem;
            color: #8a8d91;
            text-transform: uppercase;
            font-weight: 700;
        }

        .time-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .is-me .time-text {
            color: var(--info);
        }

        .is-adversary .time-text {
            color: var(--danger);
        }

        .jauge-container {
            width: 100%;
            height: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .jauge-fill {
            height: 100%;
            width: 100%;
            border-radius: 20px;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .is-me .jauge-fill {
            background-color: var(--info);
            box-shadow: 0 0 15px var(--info);
        }

        .is-adversary .jauge-fill {
            background-color: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }

        .time-critical .jauge-fill {
            background-color: var(--warning) !important;
            box-shadow: 0 0 20px var(--warning) !important;
        }

        .time-critical .time-text {
            color: var(--warning) !important;
            animation: pulseGlow 0.5s infinite alternate;
        }

        /* --- VISION ADVERSAIRE --- */
        #vision-adversaire {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 50px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
            color: #8a8d91;
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-text {
            color: var(--info);
            font-style: normal;
            font-weight: 900;
        }

        /* --- INTERFACE DE QUESTION (LE CŒUR) --- */
        #interface-jeu {
            width: 100%;
            max-width: 900px;
            text-align: center;
            display: none;
            padding: 50px;
        }

        #question-info {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .badge {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .badge-theme {
            background: linear-gradient(45deg, #9C27B0, #E040FB);
            color: white;
        }

        .diff-facile {
            background: linear-gradient(45deg, #00C853, #64DD17);
            color: black;
        }

        .diff-moyen {
            background: linear-gradient(45deg, #FF9100, #FFD600);
            color: black;
        }

        .diff-difficile {
            background: linear-gradient(45deg, #D50000, #FF1744);
            color: white;
        }

        .action-row {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            margin-top: 40px;
        }

        /* Input géant stylé */
        #input-reponse {
            width: 100%;
            max-width: 600px;
            font-size: 1.8rem;
            padding: 25px;
            text-align: center;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
        }

        #input-reponse:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.3), inset 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        #input-reponse:disabled {
            opacity: 0.3;
        }

        #feedback-reponse {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            margin-top: 25px;
            font-size: 1.5rem;
            min-height: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1>Coup Fatal</h1>

    <div id="menu" class="glass-panel">
        <h3 style="color: white;">Rejoindre l'Arène</h3>
        <div class="input-group">
            <label>Ton Pseudo</label>
            <input type="text" id="input-pseudo" placeholder="Ex: Faker" autocomplete="off" maxlength="12">
        </div>
        <div class="input-group">
            <label>Code Secret</label>
            <input type="text" id="input-salon" placeholder="Ex: DUEL42" autocomplete="off"
                style="text-transform: uppercase;">
        </div>
        <div class="input-group">
            <label>Pression (Temps)</label>
            <select id="input-temps">
                <option value="30">30s - Mort Subite</option>
                <option value="60" selected>60s - Classique</option>
                <option value="90">90s - Stratégique</option>
            </select>
        </div>
        <button class="btn btn-lancer" onclick="rejoindreSalon()">Entrer dans l'arène</button>
    </div>

    <div id="zone-jeu">
        <div class="game-header">
            <h2>ROOM: <span id="nom-salon"></span></h2>
            <div id="messages">Connexion au serveur...</div>
        </div>

        <button id="btn-demarrer" class="btn" style="display: none;" onclick="lancerPartie()">Lancer le Match !</button>

        <div id="chronos">
        </div>

        <div id="vision-adversaire" style="display: none;"><em>En attente des autres joueurs...</em></div>

        <div id="interface-jeu" class="glass-panel">
            <div id="question-info" style="display: none;">
                <span id="badge-theme" class="badge badge-theme">Thème</span>
                <span id="badge-difficulte" class="badge">Diff</span>
            </div>

            <h3 id="texte-question">Préparez-vous...</h3>

            <div class="action-row">
                <input type="text" id="input-reponse" placeholder="TA RÉPONSE..." autocomplete="off"
                    onkeypress="gererToucheEntree(event)" oninput="transmettreFrappe()">
                <button id="btn-valider" class="btn btn-valider" onclick="envoyerReponse()">Valider</button>
                <button id="btn-skip" class="btn btn-skip" onclick="skipQuestion()">Passer</button>
            </div>

            <p id="feedback-reponse"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let codeDuSalon = "";
        let tempsInitialParametre = 60;
        let jeSuisChef = false;

        function rejoindreSalon() {
            codeDuSalon = document.getElementById('input-salon').value.toUpperCase();
            const monPseudo = document.getElementById('input-pseudo').value;
            tempsInitialParametre = parseInt(document.getElementById('input-temps').value);

            if (codeDuSalon.trim() !== "" && monPseudo.trim() !== "") {
                socket.emit('rejoindre_salon', { codeSalon: codeDuSalon, pseudo: monPseudo, tempsChoisi: tempsInitialParametre });
                document.getElementById('menu').style.display = 'none';
                document.getElementById('zone-jeu').style.display = 'flex';
                document.getElementById('nom-salon').innerText = codeDuSalon;
            }
        }

        function lancerPartie() { socket.emit('lancer_partie', codeDuSalon); }

        function transmettreFrappe() {
            const texteActuel = document.getElementById('input-reponse').value;
            socket.emit('en_train_de_taper', { codeSalon: codeDuSalon, texte: texteActuel });
        }

        function envoyerReponse() {
            const reponse = document.getElementById('input-reponse').value;
            socket.emit('proposer_reponse', { codeSalon: codeDuSalon, reponseJoueur: reponse });
        }

        function gererToucheEntree(event) {
            if (event.key === "Enter") {
                const input = document.getElementById('input-reponse');
                if (!input.disabled) envoyerReponse();
            }
        }

        function skipQuestion() {
            socket.emit('skip_question', codeDuSalon);
            document.getElementById('input-reponse').value = "";
            document.getElementById('feedback-reponse').innerText = "";
            transmettreFrappe();
        }

        socket.on('info_role', (data) => { jeSuisChef = data.estChef; });

        socket.on('maj_joueurs', (nbJoueurs) => {
            const btnDemarrer = document.getElementById('btn-demarrer');
            const msg = document.getElementById('messages');

            if (jeSuisChef) {
                if (nbJoueurs >= 2) {
                    btnDemarrer.style.display = 'block';
                    msg.innerText = "PRÊT POUR LE MATCH";
                    msg.style.color = "var(--primary)";
                } else {
                    btnDemarrer.style.display = 'none';
                    msg.innerText = "EN ATTENTE D'UN ADVERSAIRE...";
                    msg.style.color = "var(--warning)";
                }
            } else {
                btnDemarrer.style.display = 'none';
                if (nbJoueurs >= 2) {
                    msg.innerText = "EN ATTENTE DU CHEF...";
                } else {
                    msg.innerText = "EN ATTENTE D'AUTRES JOUEURS...";
                }
            }
        });

        socket.on('partie_lancee', () => {
            document.getElementById('btn-demarrer').style.display = 'none';
            const vision = document.getElementById('vision-adversaire');
            vision.innerHTML = `<em>Génération du plateau...</em>`;
            vision.style.display = 'flex';
        });

        // NOUVEAU DESIGN DES CHRONOS
        socket.on('maj_temps', (data) => {
            const { temps, pseudos } = data;
            const chronosContainer = document.getElementById('chronos');

            const idsTries = Object.keys(temps).sort((a, b) => {
                if (a === socket.id) return -1;
                if (b === socket.id) return 1;
                return 0;
            });

            const chronosExistants = chronosContainer.querySelectorAll('.chrono-player');
            chronosExistants.forEach(chrono => {
                const idDiv = chrono.id.replace('chrono-', '');
                if (!temps[idDiv]) chrono.remove();
            });

            for (let id of idsTries) {
                const timeLeft = temps[id];
                const pseudo = pseudos[id];
                const isMe = (id === socket.id);
                const classType = isMe ? 'is-me' : 'is-adversary';
                const totalTime = tempsInitialParametre || 60;
                const pourcentage = (timeLeft / totalTime) * 100;
                const classCritical = timeLeft <= 15 ? 'time-critical' : '';

                // Première lettre du pseudo pour l'avatar
                const initiale = pseudo.charAt(0).toUpperCase();

                let divChrono = document.getElementById(`chrono-${id}`);

                if (!divChrono) {
                    const newHTML = `
                        <div id="chrono-${id}" class="chrono-player ${classType} ${classCritical}">
                            <div class="player-header">
                                <div class="avatar">${initiale}</div>
                                <div class="player-info-text">
                                    <span class="player-name">${pseudo}</span>
                                    <span class="player-role">${isMe ? 'Toi' : 'Adversaire'}</span>
                                </div>
                                <span class="time-text">${timeLeft}</span>
                            </div>
                            <div class="jauge-container">
                                <div id="jauge-${id}" class="jauge-fill" style="width: ${pourcentage}%;"></div>
                            </div>
                        </div>
                    `;
                    chronosContainer.insertAdjacentHTML('beforeend', newHTML);
                } else {
                    divChrono.querySelector('.time-text').innerText = `${timeLeft}`;
                    document.getElementById(`jauge-${id}`).style.width = `${pourcentage}%`;

                    if (timeLeft <= 15) divChrono.classList.add('time-critical');
                    else divChrono.classList.remove('time-critical');
                }
            }
        });

        socket.on('changement_tour', (idJoueurActif) => {
            document.getElementById('interface-jeu').style.display = 'block';

            const inputReponse = document.getElementById('input-reponse');
            const btnValider = document.getElementById('btn-valider');
            const btnSkip = document.getElementById('btn-skip');
            const msg = document.getElementById('messages');
            const inputContainer = document.getElementById('input-reponse');

            // Nettoie l'animation d'erreur
            inputContainer.classList.remove('shake-animation');

            const tousLesChronos = document.querySelectorAll('.chrono-player');
            tousLesChronos.forEach(c => c.classList.remove('active-turn'));
            const divActive = document.getElementById(`chrono-${idJoueurActif}`);
            if (divActive) divActive.classList.add('active-turn');

            if (socket.id === idJoueurActif) {
                inputReponse.disabled = false;
                btnValider.disabled = false;
                btnSkip.disabled = false;
                inputReponse.value = "";
                inputReponse.focus();
                transmettreFrappe();
                msg.innerText = "🟢 À TOI DE JOUER !";
                msg.style.color = "var(--primary)";
            } else {
                inputReponse.disabled = true;
                btnValider.disabled = true;
                btnSkip.disabled = true;
                inputReponse.value = "";
                msg.innerText = "🔴 TOUR DE L'ADVERSAIRE";
                msg.style.color = "var(--danger)";
            }
        });

        socket.on('nouvelle_question', (data) => {
            const { question, theme, difficulte } = data;

            document.getElementById('texte-question').innerText = `${question}`;

            document.getElementById('question-info').style.display = 'flex';
            document.getElementById('badge-theme').innerText = theme || "Général";

            const badgeDiff = document.getElementById('badge-difficulte');
            badgeDiff.innerText = difficulte || "Normal";

            badgeDiff.className = 'badge';
            if (difficulte === "Facile") badgeDiff.classList.add('diff-facile');
            else if (difficulte === "Moyen") badgeDiff.classList.add('diff-moyen');
            else if (difficulte === "Difficile") badgeDiff.classList.add('diff-difficile');
            else badgeDiff.classList.add('diff-moyen');
        });

        socket.on('frappe_adversaire', (data) => {
            const divVision = document.getElementById('vision-adversaire');
            if (data.texte === "") {
                divVision.innerHTML = `<em>L'adversaire réfléchit...</em>`;
            } else {
                divVision.innerHTML = `L'adversaire tape : <span class="typing-text" style="margin-left: 10px;">${data.texte}</span>`;
            }
        });

        socket.on('bonne_reponse', (msg) => {
            const feed = document.getElementById('feedback-reponse');
            feed.style.color = "var(--primary)";
            feed.innerText = msg;
            document.getElementById('vision-adversaire').innerHTML = `<em>Changement de tour...</em>`;
        });

        socket.on('mauvaise_reponse', (msg) => {
            const feed = document.getElementById('feedback-reponse');
            const inputContainer = document.getElementById('input-reponse');

            feed.style.color = "var(--danger)";
            feed.innerText = msg;

            // Ajoute l'effet de tremblement
            inputContainer.classList.remove('shake-animation');
            void inputContainer.offsetWidth; // Force la réinitialisation de l'animation
            inputContainer.classList.add('shake-animation');
        });

        socket.on('fin_partie', (msg) => {
            document.getElementById('interface-jeu').style.display = 'none';
            document.getElementById('vision-adversaire').style.display = 'none';

            const mess = document.getElementById('messages');
            mess.innerText = "🏆 GAME OVER";
            mess.style.color = "var(--primary)";
            mess.style.fontSize = "2.5rem";

            alert(msg);
        });
    </script>
</body>

</html>
