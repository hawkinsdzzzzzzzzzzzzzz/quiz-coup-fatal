<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup Fatal - Le Duel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        :root {
            --primary: #00E676;
            --danger: #FF1744;
            --warning: #FF9100;
            --info: #00B0FF;
            --glass-bg: rgba(20, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0b0c10;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 176, 255, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(255, 23, 68, 0.15), transparent 25%);
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #00B0FF, #00E676);
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.3));
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #c5c6c7;
            font-size: 1.5rem;
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px var(--warning);
            }

            50% {
                box-shadow: 0 0 30px var(--warning);
            }

            100% {
                box-shadow: 0 0 15px var(--warning);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-10px);
            }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
            border-color: var(--danger) !important;
        }

        @keyframes pulseGlowText {
            0% {
                text-shadow: 0 0 10px var(--warning);
            }

            50% {
                text-shadow: 0 0 25px var(--warning), 0 0 10px var(--warning);
            }

            100% {
                text-shadow: 0 0 10px var(--warning);
            }
        }

        .btn {
            padding: 15px 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(1);
        }

        .btn-lancer {
            background: linear-gradient(45deg, var(--info), #0044ff);
            box-shadow: 0 10px 20px rgba(0, 176, 255, 0.3);
            width: 100%;
            margin-top: 10px;
        }

        .btn-valider {
            background: linear-gradient(45deg, var(--primary), #00a152);
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.3);
        }

        .btn-faux {
            background: linear-gradient(45deg, var(--danger), #b71c1c);
            box-shadow: 0 10px 20px rgba(255, 23, 68, 0.3);
        }

        .btn-skip {
            background: linear-gradient(45deg, var(--warning), #ff6d00);
            box-shadow: 0 10px 20px rgba(255, 145, 0, 0.3);
        }

        #btn-demarrer {
            background: linear-gradient(45deg, #d500f9, #651fff);
            font-size: 1.5rem;
            padding: 20px 50px;
            margin-bottom: 30px;
            animation: popIn 0.5s forwards, pulseGlow 2s infinite;
        }

        #btn-buzzer {
            background: linear-gradient(135deg, #FF1744, #b71c1c);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            font-size: 2.5rem;
            border: 8px solid #ff5252;
            box-shadow: 0 20px 50px rgba(255, 23, 68, 0.5), inset 0 10px 20px rgba(255, 255, 255, 0.3);
            display: none;
            margin: 20px auto;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #btn-buzzer:hover {
            transform: scale(1.1);
            box-shadow: 0 25px 60px rgba(255, 23, 68, 0.7), inset 0 10px 20px rgba(255, 255, 255, 0.3);
        }

        #btn-buzzer:active {
            transform: scale(0.95);
            box-shadow: 0 10px 20px rgba(255, 23, 68, 0.5);
        }

        input[type="text"],
        select {
            padding: 18px 25px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 15px;
            border: 2px solid var(--glass-border);
            width: 100%;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--info);
            box-shadow: 0 0 20px rgba(0, 176, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.7);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 40px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #menu {
            width: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #8a8d91;
            font-family: 'Montserrat';
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--info);
            text-shadow: 0 0 10px rgba(0, 176, 255, 0.5);
        }

        .tab-content {
            display: none;
            text-align: left;
        }

        .tab-content.active {
            display: block;
            animation: popIn 0.3s forwards;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #8a8d91;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #mode-description {
            margin-top: -10px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: var(--info);
            font-style: italic;
            text-align: center;
            background: rgba(0, 176, 255, 0.1);
            padding: 8px;
            border-radius: 10px;
        }

        #bonus-presentateur {
            display: none;
            background: rgba(255, 145, 0, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px dashed var(--warning);
            text-align: left;
        }

        .bonus-title {
            color: var(--warning);
            font-size: 0.85rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--warning);
            cursor: pointer;
        }

        .public-room-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .public-room-card:hover {
            border-color: var(--info);
            background: rgba(0, 176, 255, 0.1);
        }

        .room-info {
            display: flex;
            flex-direction: column;
        }

        .room-title {
            font-weight: 900;
            font-size: 1.1rem;
            color: white;
        }

        .room-details {
            font-size: 0.8rem;
            color: #8a8d91;
            text-transform: uppercase;
        }

        .btn-join-room {
            padding: 8px 15px;
            font-size: 0.9rem;
            background: var(--info);
            border-radius: 20px;
            color: white;
            border: none;
            font-weight: 900;
            cursor: pointer;
        }

        #empty-rooms {
            text-align: center;
            color: #8a8d91;
            font-style: italic;
            margin-top: 20px;
        }

        #zone-jeu {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
        }

        #nom-salon {
            color: var(--info);
            font-weight: 900;
            letter-spacing: 2px;
        }

        #lobby-players {
            font-size: 0.95rem;
            color: #8a8d91;
            margin-top: 8px;
            font-weight: 700;
            font-style: italic;
        }

        #messages {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--warning);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        #chronos {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .chrono-player {
            background: var(--glass-bg);
            border-radius: 25px;
            padding: 25px;
            width: 320px;
            border: 2px solid var(--glass-border);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .chrono-player.active-turn {
            border-color: var(--primary);
            transform: scale(1.08) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 230, 118, 0.2);
            background: rgba(0, 230, 118, 0.05);
            z-index: 10;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: white;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .is-me .avatar {
            background: linear-gradient(135deg, var(--info), #0044ff);
        }

        .is-adversary .avatar {
            background: linear-gradient(135deg, var(--danger), #b71c1c);
        }

        .player-info-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .player-name {
            font-weight: 900;
            font-size: 1.2rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .player-role {
            font-size: 0.8rem;
            color: #8a8d91;
            text-transform: uppercase;
            font-weight: 700;
        }

        .player-score {
            font-size: 0.95rem;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 5px;
            display: inline-block;
            border: 1px solid #333;
        }

        .score-positive {
            color: var(--primary);
            border-color: var(--primary);
        }

        .score-negative {
            color: var(--danger);
            border-color: var(--danger);
        }

        .score-neutral {
            color: #8a8d91;
        }

        .time-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .is-me .time-text {
            color: var(--info);
        }

        .is-adversary .time-text {
            color: var(--danger);
        }

        .jauge-container {
            width: 100%;
            height: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .jauge-fill {
            height: 100%;
            width: 100%;
            border-radius: 20px;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .is-me .jauge-fill {
            background-color: var(--info);
            box-shadow: 0 0 15px var(--info);
        }

        .is-adversary .jauge-fill {
            background-color: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }

        .time-critical .jauge-fill {
            background-color: var(--warning) !important;
            box-shadow: 0 0 20px var(--warning) !important;
        }

        .time-critical .time-text {
            color: var(--warning) !important;
            animation: pulseGlowText 0.5s infinite alternate;
        }

        #timer-buzzer {
            display: none;
            font-family: 'Montserrat';
            font-weight: 900;
            font-size: 5rem;
            color: var(--danger);
            text-shadow: 0 0 30px rgba(255, 23, 68, 0.8);
            margin-bottom: 20px;
        }

        #vision-adversaire {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 50px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
            color: #8a8d91;
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-text {
            color: var(--info);
            font-style: normal;
            font-weight: 900;
        }

        #interface-jeu {
            width: 100%;
            max-width: 900px;
            text-align: center;
            display: none;
            padding: 50px;
        }

        #question-info {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .badge {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .badge-theme {
            background: linear-gradient(45deg, #9C27B0, #E040FB);
            color: white;
        }

        .diff-facile {
            background: linear-gradient(45deg, #00C853, #64DD17);
            color: black;
        }

        .diff-moyen {
            background: linear-gradient(45deg, #FF9100, #FFD600);
            color: black;
        }

        .diff-difficile {
            background: linear-gradient(45deg, #D50000, #FF1744);
            color: white;
        }

        .action-row {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        #input-reponse {
            width: 100%;
            max-width: 600px;
            font-size: 1.8rem;
            padding: 25px;
            text-align: center;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
        }

        #input-reponse:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.3), inset 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        #input-reponse:disabled {
            opacity: 0.3;
        }

        #zone-presentateur {
            display: none;
            background: rgba(255, 23, 68, 0.1);
            padding: 20px;
            border-radius: 20px;
            border: 1px dashed var(--danger);
            margin-bottom: 20px;
        }

        #reponses-attendues {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        #feedback-reponse {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            margin-top: 25px;
            font-size: 1.5rem;
            min-height: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1>Coup Fatal</h1>

    <div id="menu" class="glass-panel">
        <div class="input-group" style="margin-bottom: 15px;">
            <label>Ton Pseudo</label>
            <input type="text" id="input-pseudo" placeholder="Ex: Faker" autocomplete="off" maxlength="12">
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rejoindre')">Rejoindre</button>
            <button class="tab-btn" onclick="switchTab('creer')">Créer</button>
        </div>

        <div id="tab-rejoindre" class="tab-content active">
            <div class="input-group">
                <label>Code Privé (Optionnel)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="input-salon-rejoindre" placeholder="CODE..."
                        style="text-transform: uppercase;">
                    <button class="btn btn-lancer" style="margin: 0; padding: 0 20px;"
                        onclick="rejoindreSalonPrive()">GO</button>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <label style="color: #8a8d91; font-size: 0.9rem; font-weight: 900; text-transform: uppercase;">🌐 Salons
                    Publics</label>
                <div id="liste-salons-publics">
                    <div id="empty-rooms">Aucun salon public disponible.</div>
                </div>
            </div>
        </div>

        <div id="tab-creer" class="tab-content">
            <div class="input-group">
                <label>Visibilité</label>
                <select id="input-visibilite" onchange="toggleCodePerso()">
                    <option value="public" selected>🌍 Public (Visible de tous)</option>
                    <option value="prive">🔒 Privé (Caché)</option>
                </select>
            </div>

            <div class="input-group" id="div-code-perso" style="display: none;">
                <label>Code Secret Personnalisé</label>
                <input type="text" id="input-salon-creer" placeholder="Code secret" style="text-transform: uppercase;">
            </div>

            <div class="input-group">
                <label>Mode de Jeu</label>
                <select id="input-mode" onchange="changerDescriptionMode()">
                    <option value="classique" selected>Mode Classique (Clavier)</option>
                    <option value="buzzer">Mode Buzzer (Écrit)</option>
                    <option value="presentateur">Mode Présentateur (Vocal)</option>
                </select>
            </div>
            <div id="mode-description">Chacun son tour, tapez la réponse le plus vite possible.</div>

            <div id="bonus-presentateur">
                <div class="bonus-title">👑 Options du Maître du Jeu</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="opt-voir-questions">
                    Les joueurs peuvent lire la question
                </label>
            </div>

            <div class="input-group" id="div-temps-global">
                <label>Pression (Temps)</label>
                <select id="input-temps">
                    <option value="30">30s - Mort Subite</option>
                    <option value="60" selected>60s - Classique</option>
                    <option value="90">90s - Stratégique</option>
                </select>
            </div>
            <button class="btn btn-lancer" onclick="creerNouveauSalon()">Créer la partie</button>
        </div>
    </div>

    <div id="zone-jeu">
        <div class="game-header">
            <div>
                <h2>ROOM: <span id="nom-salon"></span></h2>
                <div id="lobby-players">👥 En attente de joueurs...</div>
            </div>
            <div id="messages">Connexion au serveur...</div>
        </div>

        <button id="btn-demarrer" class="btn" style="display: none;" onclick="lancerPartie()">Lancer le Match !</button>

        <div id="chronos"></div>

        <div id="vision-adversaire" style="display: none;"><em>En attente des autres joueurs...</em></div>

        <div id="interface-jeu" class="glass-panel">
            <div id="question-info" style="display: none;">
                <span id="badge-theme" class="badge badge-theme">Thème</span>
                <span id="badge-difficulte" class="badge">Diff</span>
            </div>

            <h3 id="texte-question">Préparez-vous...</h3>

            <div id="zone-presentateur">
                <p style="color: white; margin-bottom: 5px;">RÉPONSES ACCEPTÉES :</p>
                <div id="reponses-attendues">...</div>
            </div>

            <div id="timer-buzzer">5</div>

            <div class="action-row" id="zone-actions">
                <button id="btn-buzzer" class="btn" onclick="appuyerBuzzer()">BUZZ !</button>

                <input type="text" id="input-reponse" placeholder="TA RÉPONSE..." autocomplete="off"
                    onkeypress="gererToucheEntree(event)" oninput="transmettreFrappe()">
                <button id="btn-valider" class="btn btn-valider" onclick="envoyerReponse()">Valider</button>

                <button id="btn-presentateur-vrai" class="btn btn-valider"
                    style="display: none; padding: 25px 50px; font-size: 1.5rem;" onclick="juger(true)">✅
                    CORRECT</button>
                <button id="btn-presentateur-faux" class="btn btn-faux"
                    style="display: none; padding: 25px 50px; font-size: 1.5rem;" onclick="juger(false)">❌ FAUX
                    (Suivant)</button>

                <button id="btn-skip" class="btn btn-skip" onclick="skipQuestion()">Passer (Skip)</button>
            </div>

            <p id="feedback-reponse"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let codeDuSalon = "";
        let monMode = "classique";
        let jeSuisChef = false;
        let jeSuisPresentateur = false;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function toggleCodePerso() {
            const isPrive = document.getElementById('input-visibilite').value === 'prive';
            document.getElementById('div-code-perso').style.display = isPrive ? 'block' : 'none';
        }

        function changerDescriptionMode() {
            const mode = document.getElementById('input-mode').value;
            const desc = document.getElementById('mode-description');
            const bonusMenu = document.getElementById('bonus-presentateur');
            const divTemps = document.getElementById('div-temps-global');

            if (mode === 'classique') {
                desc.innerText = "Chacun son tour, tapez la réponse le plus vite possible.";
                bonusMenu.style.display = 'none'; divTemps.style.display = 'block';
            }
            if (mode === 'presentateur') {
                desc.innerText = "Le créateur lit la question en vocal et juge vos réponses !";
                bonusMenu.style.display = 'block'; divTemps.style.display = 'block';
            }
            if (mode === 'buzzer') {
                desc.innerText = "🚨 Système de vote pour passer. +10 Pts si juste, -5 Pts si faux ou trop lent (5s) !";
                bonusMenu.style.display = 'none'; divTemps.style.display = 'none';
            }
        }

        function rejoindreSalon(codeSpecifique = null) {
            const monPseudo = document.getElementById('input-pseudo').value;
            codeDuSalon = codeSpecifique || document.getElementById('input-salon-rejoindre').value.toUpperCase();
            if (codeDuSalon.trim() !== "" && monPseudo.trim() !== "") {
                socket.emit('rejoindre_salon', { codeSalon: codeDuSalon, pseudo: monPseudo, estPublic: false });
                afficherZoneJeu();
            } else { alert("N'oublie pas ton pseudo !"); }
        }
        function rejoindreSalonPrive() { rejoindreSalon(null); }

        function creerNouveauSalon() {
            const monPseudo = document.getElementById('input-pseudo').value;
            const visibilite = document.getElementById('input-visibilite').value;
            let code = document.getElementById('input-salon-creer').value.toUpperCase();
            if (visibilite === 'public' || code.trim() === "") code = Math.random().toString(36).substring(2, 6).toUpperCase();

            codeDuSalon = code;
            const tempsInitialParametre = parseInt(document.getElementById('input-temps').value);
            const modeChoisi = document.getElementById('input-mode').value;
            const optionsBonus = { voirQuestions: document.getElementById('opt-voir-questions').checked };

            if (monPseudo.trim() !== "") {
                socket.emit('rejoindre_salon', { codeSalon: codeDuSalon, pseudo: monPseudo, tempsChoisi: tempsInitialParametre, modeChoisi: modeChoisi, optionsBonus: optionsBonus, estPublic: (visibilite === 'public') });
                afficherZoneJeu();
            } else { alert("Tu dois choisir un pseudo !"); }
        }

        function afficherZoneJeu() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('zone-jeu').style.display = 'flex';
            document.getElementById('nom-salon').innerText = codeDuSalon;
        }

        socket.on('maj_salons_publics', (salons) => {
            const conteneur = document.getElementById('liste-salons-publics');
            if (salons.length === 0) { conteneur.innerHTML = `<div id="empty-rooms">Aucun salon public disponible.</div>`; return; }
            let html = "";
            salons.forEach(salon => {
                let modeTxt = salon.mode === 'presentateur' ? '🎤 Vocal' : (salon.mode === 'buzzer' ? '🚨 Buzzer' : '⌨️ Classique');
                html += `
                    <div class="public-room-card">
                        <div class="room-info"><span class="room-title">Partie de ${salon.createur}</span><span class="room-details">${modeTxt} • Joueurs: ${salon.nbJoueurs}</span></div>
                        <button class="btn-join-room" onclick="rejoindreSalon('${salon.code}')">Rejoindre</button>
                    </div>`;
            });
            conteneur.innerHTML = html;
        });

        socket.on('maj_lobby', (pseudos) => {
            const lobbyDiv = document.getElementById('lobby-players');
            if (lobbyDiv) lobbyDiv.innerText = "👥 Joueurs présents : " + pseudos.join(', ');
        });

        function lancerPartie() { socket.emit('lancer_partie', codeDuSalon); }
        function transmettreFrappe() { socket.emit('en_train_de_taper', { codeSalon: codeDuSalon, texte: document.getElementById('input-reponse').value }); }
        function envoyerReponse() { socket.emit('proposer_reponse', { codeSalon: codeDuSalon, reponseJoueur: document.getElementById('input-reponse').value }); }
        function gererToucheEntree(event) { if (event.key === "Enter" && !document.getElementById('input-reponse').disabled) envoyerReponse(); }
        function skipQuestion() { socket.emit('skip_question', codeDuSalon); document.getElementById('input-reponse').value = ""; document.getElementById('feedback-reponse').innerText = ""; transmettreFrappe(); }
        function juger(estCorrect) { socket.emit('jugement_presentateur', { codeSalon: codeDuSalon, estCorrect: estCorrect }); }
        function appuyerBuzzer() { socket.emit('clic_buzzer', codeDuSalon); }

        socket.on('info_role', (data) => { jeSuisChef = data.estChef; jeSuisPresentateur = data.estPresentateur; monMode = data.mode; });

        socket.on('maj_joueurs', (nbJoueurs) => {
            const btnDemarrer = document.getElementById('btn-demarrer');
            const msg = document.getElementById('messages');
            if (jeSuisChef) {
                if ((monMode === 'presentateur' && nbJoueurs >= 1) || (monMode !== 'presentateur' && nbJoueurs >= 2)) {
                    btnDemarrer.style.display = 'block'; msg.innerText = "PRÊT POUR LE MATCH"; msg.style.color = "var(--primary)";
                } else {
                    btnDemarrer.style.display = 'none'; msg.innerText = "EN ATTENTE DE JOUEURS..."; msg.style.color = "var(--warning)";
                }
            } else { btnDemarrer.style.display = 'none'; msg.innerText = "EN ATTENTE DU CHEF..."; }
        });

        socket.on('partie_lancee', () => {
            document.getElementById('btn-demarrer').style.display = 'none';
            document.getElementById('lobby-players').style.display = 'none';

            if (monMode === 'classique' || monMode === 'buzzer') {
                document.getElementById('vision-adversaire').style.display = 'flex';
                document.getElementById('vision-adversaire').innerHTML = `<em>Génération du plateau...</em>`;
            }
        });

        socket.on('maj_temps', (data) => {
            const { temps, pseudos, scores } = data;
            const chronosContainer = document.getElementById('chronos');
            const idsTries = Object.keys(temps).sort((a, b) => { if (a === socket.id) return -1; if (b === socket.id) return 1; return 0; });

            const chronosExistants = chronosContainer.querySelectorAll('.chrono-player');
            chronosExistants.forEach(chrono => { const idDiv = chrono.id.replace('chrono-', ''); if (!temps[idDiv]) chrono.remove(); });

            for (let id of idsTries) {
                const timeLeft = temps[id];
                const pseudo = pseudos[id];
                const isMe = (id === socket.id);
                const classType = isMe ? 'is-me' : 'is-adversary';
                const totalTime = parseInt(document.getElementById('input-temps').value) || 60;
                const pourcentage = (timeLeft / totalTime) * 100;
                const classCritical = timeLeft <= 15 ? 'time-critical' : '';

                const score = scores && scores[id] !== undefined ? scores[id] : 0;
                let scoreClass = 'score-neutral';
                if (score > 0) scoreClass = 'score-positive';
                if (score < 0) scoreClass = 'score-negative';
                const scoreHTML = monMode === 'buzzer' ? `<span class="player-score ${scoreClass}">Score: ${score}</span>` : '';

                const initiale = pseudo.charAt(0).toUpperCase();
                let divChrono = document.getElementById(`chrono-${id}`);

                // CORRECTION DU CRASH: On insère ET on récupère l'élément juste après !
                if (!divChrono) {
                    const newHTML = `
                        <div id="chrono-${id}" class="chrono-player ${classType} ${classCritical}">
                            <div class="player-header">
                                <div class="avatar">${initiale}</div>
                                <div class="player-info-text">
                                    <span class="player-name">${pseudo}</span>
                                    <span class="player-role">${isMe ? 'Toi' : 'Joueur'}</span>
                                    ${scoreHTML}
                                </div>
                                <span class="time-text">${timeLeft}</span>
                            </div>
                            <div class="jauge-container">
                                <div id="jauge-${id}" class="jauge-fill" style="width: ${pourcentage}%;"></div>
                            </div>
                        </div>
                    `;
                    chronosContainer.insertAdjacentHTML('beforeend', newHTML);
                    divChrono = document.getElementById(`chrono-${id}`); // INDISPENSABLE
                } else {
                    divChrono.querySelector('.time-text').innerText = `${timeLeft}`;
                    document.getElementById(`jauge-${id}`).style.width = `${pourcentage}%`;
                    if (timeLeft <= 15) divChrono.classList.add('time-critical'); else divChrono.classList.remove('time-critical');

                    const scoreEl = divChrono.querySelector('.player-score');
                    if (scoreEl) { scoreEl.innerText = `Score: ${score}`; scoreEl.className = `player-score ${scoreClass}`; }
                }

                if (monMode === 'buzzer' && divChrono) {
                    divChrono.querySelector('.time-text').style.display = 'none';
                    divChrono.querySelector('.jauge-container').style.display = 'none';
                }
            }
        });

        socket.on('tic_tac_buzzer', (tempsRestant) => {
            const timer = document.getElementById('timer-buzzer');
            timer.style.display = 'block';
            timer.innerText = tempsRestant;
            if (tempsRestant <= 2) {
                timer.style.transform = 'scale(1.2)';
            } else {
                timer.style.transform = 'scale(1)';
            }
        });

        socket.on('maj_votes_skip', (data) => {
            if (monMode === 'buzzer') {
                const btnSkip = document.getElementById('btn-skip');
                btnSkip.innerText = `Voter pour Passer (${data.votes}/${Math.floor(data.total / 2) + 1})`;
            }
        });

        socket.on('message_serveur', (msg) => {
            document.getElementById('messages').innerText = msg;
            document.getElementById('messages').style.color = "var(--primary)";
        });

        socket.on('changement_tour', (data) => {
            document.getElementById('interface-jeu').style.display = 'block';

            const inputReponse = document.getElementById('input-reponse');
            const btnValider = document.getElementById('btn-valider');
            const btnSkip = document.getElementById('btn-skip');
            const btnBuzzer = document.getElementById('btn-buzzer');
            const msg = document.getElementById('messages');
            const timer = document.getElementById('timer-buzzer');

            inputReponse.classList.remove('shake-animation');

            const idJoueurActif = typeof data === 'object' ? data.idJoueurActif : data;

            const tousLesChronos = document.querySelectorAll('.chrono-player');
            tousLesChronos.forEach(c => c.classList.remove('active-turn'));

            if (idJoueurActif && idJoueurActif !== 'bloque') {
                const divActive = document.getElementById(`chrono-${idJoueurActif}`);
                if (divActive) divActive.classList.add('active-turn');
            }

            if (jeSuisPresentateur) {
                inputReponse.style.display = 'none'; btnValider.style.display = 'none'; btnBuzzer.style.display = 'none';
                document.getElementById('btn-presentateur-vrai').style.display = 'inline-block';
                document.getElementById('btn-presentateur-faux').style.display = 'inline-block';
                document.getElementById('zone-presentateur').style.display = 'block';
                msg.innerText = "🎤 ÉCOUTE ET JUGE !"; msg.style.color = "var(--primary)";
            }
            else if (monMode === 'presentateur') {
                inputReponse.style.display = 'none'; btnValider.style.display = 'none'; btnBuzzer.style.display = 'none';
                if (socket.id === idJoueurActif) { msg.innerText = "🗣️ PARLE ! C'EST À TOI !"; msg.style.color = "var(--primary)"; btnSkip.disabled = false; }
                else { msg.innerText = "🎧 ÉCOUTE TON ADVERSAIRE"; msg.style.color = "var(--warning)"; btnSkip.disabled = true; }
            }
            else if (monMode === 'buzzer') {
                if (idJoueurActif === null) {
                    inputReponse.style.display = 'none'; btnValider.style.display = 'none';
                    btnSkip.style.display = 'inline-block';
                    btnSkip.disabled = false;
                    timer.style.display = 'none';

                    btnBuzzer.style.display = 'block';
                    msg.innerText = "🚨 PRÉPAREZ-VOUS À BUZZER !";
                    msg.style.color = "var(--warning)";

                } else if (idJoueurActif === 'bloque') {
                    btnBuzzer.style.display = 'none';
                    inputReponse.disabled = true; btnValider.disabled = true; btnSkip.disabled = true;
                } else {
                    btnBuzzer.style.display = 'none';
                    btnSkip.disabled = true;

                    if (socket.id === idJoueurActif) {
                        inputReponse.style.display = 'inline-block'; btnValider.style.display = 'inline-block';
                        inputReponse.disabled = false; btnValider.disabled = false;
                        inputReponse.value = ""; inputReponse.focus(); transmettreFrappe();
                        msg.innerText = "⚡ TAPE VITE TA RÉPONSE !"; msg.style.color = "var(--primary)";
                    } else {
                        inputReponse.style.display = 'inline-block'; btnValider.style.display = 'inline-block';
                        inputReponse.disabled = true; btnValider.disabled = true;
                        inputReponse.value = "";
                        msg.innerText = "🔴 TROP LENT ! L'adversaire a le point."; msg.style.color = "var(--danger)";
                    }
                }
            }
            else {
                btnBuzzer.style.display = 'none'; timer.style.display = 'none';
                inputReponse.style.display = 'inline-block'; btnValider.style.display = 'inline-block';

                if (socket.id === idJoueurActif) {
                    inputReponse.disabled = false; btnValider.disabled = false; btnSkip.disabled = false;
                    inputReponse.value = ""; inputReponse.focus(); transmettreFrappe();
                    msg.innerText = "🟢 À TOI DE JOUER !"; msg.style.color = "var(--primary)";
                } else {
                    inputReponse.disabled = true; btnValider.disabled = true; btnSkip.disabled = true;
                    inputReponse.value = "";
                    msg.innerText = "🔴 TOUR DE L'ADVERSAIRE"; msg.style.color = "var(--danger)";
                }
            }
        });

        socket.on('nouvelle_question', (data) => {
            const { question, reponses, theme, difficulte, mode, options } = data;
            document.getElementById('feedback-reponse').innerText = "";

            if (mode === 'presentateur' && !jeSuisPresentateur) {
                if (options && options.voirQuestions) {
                    document.getElementById('texte-question').innerText = `${question}`;
                    document.getElementById('texte-question').style.color = "white";
                } else {
                    document.getElementById('texte-question').innerText = "🔊 Écoutez la question du présentateur...";
                    document.getElementById('texte-question').style.color = "var(--warning)";
                }
            } else {
                document.getElementById('texte-question').innerText = `${question}`;
                document.getElementById('texte-question').style.color = "white";
            }

            if (jeSuisPresentateur) {
                document.getElementById('reponses-attendues').innerText = reponses.join(' / ').toUpperCase();
            }

            document.getElementById('question-info').style.display = 'flex';
            document.getElementById('badge-theme').innerText = theme || "Général";

            const badgeDiff = document.getElementById('badge-difficulte');
            badgeDiff.innerText = difficulte || "Normal";
            badgeDiff.className = 'badge';
            if (difficulte === "Facile") badgeDiff.classList.add('diff-facile');
            else if (difficulte === "Moyen") badgeDiff.classList.add('diff-moyen');
            else if (difficulte === "Difficile") badgeDiff.classList.add('diff-difficile');
        });

        socket.on('frappe_adversaire', (data) => {
            const divVision = document.getElementById('vision-adversaire');
            if (data.texte === "") divVision.innerHTML = `<em>L'adversaire réfléchit...</em>`;
            else divVision.innerHTML = `L'adversaire tape : <span class="typing-text" style="margin-left: 10px;">${data.texte}</span>`;
        });

        socket.on('bonne_reponse', (msg) => {
            const feed = document.getElementById('feedback-reponse');
            feed.style.color = "var(--primary)";
            feed.innerText = msg;
            if (monMode !== 'presentateur') document.getElementById('vision-adversaire').innerHTML = `<em>Changement de tour...</em>`;
        });

        socket.on('mauvaise_reponse', (msg) => {
            const feed = document.getElementById('feedback-reponse');
            const interfaceContainer = document.getElementById('interface-jeu');

            feed.style.color = "var(--danger)";
            feed.innerText = msg;

            interfaceContainer.classList.remove('shake-animation');
            void interfaceContainer.offsetWidth;
            interfaceContainer.classList.add('shake-animation');
        });

        socket.on('fin_partie', (msg) => {
            document.getElementById('interface-jeu').style.display = 'none';
            document.getElementById('vision-adversaire').style.display = 'none';
            document.getElementById('timer-buzzer').style.display = 'none';

            const mess = document.getElementById('messages');
            mess.innerText = "🏆 GAME OVER";
            mess.style.color = "var(--primary)";
            mess.style.fontSize = "2.5rem";

            alert(msg);
        });
    </script>
</body>

</html>
