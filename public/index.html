<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup Fatal - Le Duel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            font-weight: 800;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 20px;
            animation: neonGlow 2s infinite alternate;
        }

        @keyframes neonGlow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #2196F3, 0 0 40px #2196F3;
            }

            to {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #2196F3, 0 0 20px #2196F3;
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }

            80% {
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        h2 {
            font-weight: 600;
            color: #bbb;
            margin-bottom: 20px;
        }

        h3 {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn {
            padding: 12px 24px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 30px;
            border: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        input[type="text"],
        select {
            padding: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            border: 2px solid #444;
            width: 300px;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #2196F3;
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.5);
        }

        #menu {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #menu .btn-lancer {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        #zone-jeu {
            display: none;
            width: 90%;
            max-width: 1000px;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        #nom-salon {
            color: #2196F3;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(33, 150, 243, 0.8);
        }

        #messages {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ff9800;
            text-align: center;
            max-width: 60%;
            transition: color 0.3s;
        }

        #btn-demarrer {
            background: linear-gradient(45deg, #9C27B0, #E040FB);
            color: white;
            font-size: 1.2rem;
            padding: 15px 40px;
            margin-bottom: 30px;
            border-radius: 50px;
            animation: popIn 0.5s forwards;
        }

        #chronos {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chrono-player {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            padding: 20px;
            flex: 1 1 calc(33% - 20px);
            min-width: 250px;
            max-width: 400px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chrono-player.active-turn {
            border-color: #ff9800;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.6);
            background-color: rgba(255, 152, 0, 0.1);
            transform: scale(1.05);
        }

        .player-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .time-text {
            font-weight: 800;
            font-size: 1.5rem;
            font-variant-numeric: tabular-nums;
        }

        .jauge-container {
            width: 100%;
            height: 12px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .jauge-fill {
            height: 100%;
            background-color: #ccc;
            width: 100%;
            border-radius: 10px;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .is-me .player-name,
        .is-me .time-text {
            color: #2196F3;
        }

        .is-me .jauge-fill {
            background-color: #2196F3;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.8);
        }

        .is-adversary .player-name,
        .is-adversary .time-text {
            color: #f44336;
        }

        .is-adversary .jauge-fill {
            background-color: #f44336;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.8);
        }

        .time-critical .jauge-fill {
            background-color: #ff9800 !important;
            box-shadow: 0 0 20px rgba(255, 152, 0, 1) !important;
            animation: pulseChrono 0.5s infinite alternate;
        }

        @keyframes pulseChrono {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.5;
            }
        }

        #vision-adversaire {
            width: 80%;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #00bcd4;
            font-size: 1.1rem;
            font-style: italic;
            min-height: 54px;
            animation: popIn 0.8s forwards;
        }

        #interface-jeu {
            display: none;
            width: 100%;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #question-info {
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .badge-theme {
            background-color: #9C27B0;
            color: white;
        }

        .diff-facile {
            background-color: #4CAF50;
            color: white;
        }

        .diff-moyen {
            background-color: #FF9800;
            color: white;
        }

        .diff-difficile {
            background-color: #F44336;
            color: white;
        }

        #texte-question {
            font-weight: 600;
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 25px;
            min-height: 40px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .action-row {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        #input-reponse {
            width: 400px;
            flex-grow: 1;
            max-width: 500px;
            font-size: 1.2rem;
            padding: 15px;
        }

        #btn-valider {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }

        #btn-skip {
            background: linear-gradient(45deg, #ff9800, #F57C00);
            color: white;
        }

        #feedback-reponse {
            font-weight: 600;
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 25px;
            transition: all 0.3s;
        }
    </style>
</head>

<body>

    <h1>Coup Fatal</h1>

    <div id="menu">
        <h3>Lobby du Duel</h3>
        <div class="input-group"><label>Ton Pseudo de duelliste</label><input type="text" id="input-pseudo"
                placeholder="Ex: Jean-Quiz" autocomplete="off"></div>
        <div class="input-group"><label>Code Secret du Salon</label><input type="text" id="input-salon"
                placeholder="Ex: DUEL42" autocomplete="off"></div>
        <div class="input-group">
            <label>Temps par Joueur</label>
            <select id="input-temps">
                <option value="30">30 Secondes (Rapide)</option>
                <option value="60" selected>60 Secondes (Normal)</option>
                <option value="90">90 Secondes (Tendu)</option>
            </select>
        </div>
        <button class="btn btn-lancer" onclick="rejoindreSalon()">Rejoindre le salon</button>
    </div>

    <div id="zone-jeu">
        <div class="game-header">
            <h2>Salon : <span id="nom-salon"></span></h2>
            <div id="messages">Connexion en cours...</div>
        </div>

        <button id="btn-demarrer" class="btn" style="display: none;" onclick="lancerPartie()">Démarrer la partie
            !</button>

        <div id="chronos"></div>

        <div id="vision-adversaire"><em>En attente des autres joueurs...</em></div>

        <div id="interface-jeu">
            <div id="question-info" style="display: none;">
                <span id="badge-theme" class="badge badge-theme">Thème</span>
                <span id="badge-difficulte" class="badge">Difficulté</span>
            </div>

            <h3 id="texte-question">Chargement de la question...</h3>
            <div class="action-row">
                <input type="text" id="input-reponse" placeholder="Tapez votre réponse ici..." autocomplete="off"
                    onkeypress="gererToucheEntree(event)" oninput="transmettreFrappe()">
                <button id="btn-valider" class="btn" onclick="envoyerReponse()">Valider</button>
                <button id="btn-skip" class="btn" onclick="skipQuestion()">Skip</button>
            </div>
            <p id="feedback-reponse"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let codeDuSalon = "";
        let tempsInitialParametre = 60;
        let jeSuisChef = false;

        function rejoindreSalon() {
            codeDuSalon = document.getElementById('input-salon').value.toUpperCase();
            const monPseudo = document.getElementById('input-pseudo').value;
            tempsInitialParametre = parseInt(document.getElementById('input-temps').value);

            if (codeDuSalon.trim() !== "" && monPseudo.trim() !== "") {
                socket.emit('rejoindre_salon', { codeSalon: codeDuSalon, pseudo: monPseudo, tempsChoisi: tempsInitialParametre });
                document.getElementById('menu').style.display = 'none';
                document.getElementById('zone-jeu').style.display = 'flex';
                document.getElementById('nom-salon').innerText = codeDuSalon;
            }
        }

        function lancerPartie() {
            socket.emit('lancer_partie', codeDuSalon);
        }

        function transmettreFrappe() {
            const texteActuel = document.getElementById('input-reponse').value;
            socket.emit('en_train_de_taper', { codeSalon: codeDuSalon, texte: texteActuel });
        }

        function envoyerReponse() {
            const reponse = document.getElementById('input-reponse').value;
            socket.emit('proposer_reponse', { codeSalon: codeDuSalon, reponseJoueur: reponse });
        }

        function gererToucheEntree(event) {
            if (event.key === "Enter") {
                const input = document.getElementById('input-reponse');
                if (!input.disabled) envoyerReponse();
            }
        }

        function skipQuestion() {
            socket.emit('skip_question', codeDuSalon);
            document.getElementById('input-reponse').value = "";
            document.getElementById('feedback-reponse').innerText = "";
            transmettreFrappe();
        }

        socket.on('info_role', (data) => { jeSuisChef = data.estChef; });

        socket.on('maj_joueurs', (nbJoueurs) => {
            const btnDemarrer = document.getElementById('btn-demarrer');
            const msg = document.getElementById('messages');

            if (jeSuisChef) {
                if (nbJoueurs >= 2) {
                    btnDemarrer.style.display = 'inline-block';
                    msg.innerText = "Tout le monde est là, Chef ! Tu peux lancer.";
                    msg.style.color = "#4CAF50";
                } else {
                    btnDemarrer.style.display = 'none';
                    msg.innerText = "En attente d'un adversaire...";
                    msg.style.color = "#ff9800";
                }
            } else {
                btnDemarrer.style.display = 'none';
                if (nbJoueurs >= 2) {
                    msg.innerText = "En attente que le Chef lance la partie...";
                } else {
                    msg.innerText = "En attente d'autres joueurs...";
                }
            }
        });

        socket.on('partie_lancee', () => {
            document.getElementById('btn-demarrer').style.display = 'none';
            document.getElementById('vision-adversaire').innerHTML = `<em>La partie se prépare...</em>`;
        });

        // CORRECTION DE L'AFFICHAGE DES CHRONOS
        socket.on('maj_temps', (data) => {
            const { temps, pseudos } = data;
            const chronosContainer = document.getElementById('chronos');

            // On classe toujours "Moi" en premier
            const idsTries = Object.keys(temps).sort((a, b) => {
                if (a === socket.id) return -1;
                if (b === socket.id) return 1;
                return 0;
            });

            // ÉTAPE 1 : Nettoyer les boîtes des joueurs qui se sont déconnectés
            const chronosExistants = chronosContainer.querySelectorAll('.chrono-player');
            chronosExistants.forEach(chrono => {
                const idDiv = chrono.id.replace('chrono-', '');
                if (!temps[idDiv]) {
                    chrono.remove(); // Le joueur n'est plus dans le salon, on efface sa boîte
                }
            });

            // ÉTAPE 2 : Créer ou mettre à jour les boîtes
            for (let id of idsTries) {
                const timeLeft = temps[id];
                const pseudo = pseudos[id];
                const isMe = (id === socket.id);
                const classType = isMe ? 'is-me' : 'is-adversary';
                const totalTime = tempsInitialParametre || 60;
                const pourcentage = (timeLeft / totalTime) * 100;
                const classCritical = timeLeft <= 15 ? 'time-critical' : '';

                let divChrono = document.getElementById(`chrono-${id}`);

                if (!divChrono) {
                    // C'est un nouveau joueur ! On crée sa boîte et on l'ajoute à la liste (sans écraser les autres)
                    const newHTML = `
                        <div id="chrono-${id}" class="chrono-player ${classType} ${classCritical}" style="animation: popIn 0.5s forwards;">
                            <div class="player-info">
                                <span class="player-name">${pseudo} ${isMe ? '(Toi)' : ''}</span>
                                <span class="time-text">${timeLeft}s</span>
                            </div>
                            <div class="jauge-container">
                                <div id="jauge-${id}" class="jauge-fill" style="width: ${pourcentage}%;"></div>
                            </div>
                        </div>
                    `;
                    chronosContainer.insertAdjacentHTML('beforeend', newHTML);
                } else {
                    // La boîte existe déjà ! On met juste les chiffres et la barre à jour
                    divChrono.querySelector('.time-text').innerText = `${timeLeft}s`;
                    document.getElementById(`jauge-${id}`).style.width = `${pourcentage}%`;

                    if (timeLeft <= 15) divChrono.classList.add('time-critical');
                    else divChrono.classList.remove('time-critical');
                }
            }
        });

        socket.on('changement_tour', (idJoueurActif) => {
            document.getElementById('interface-jeu').style.display = 'block';
            document.getElementById('vision-adversaire').style.display = 'block';

            const inputReponse = document.getElementById('input-reponse');
            const btnValider = document.getElementById('btn-valider');
            const btnSkip = document.getElementById('btn-skip');
            const msg = document.getElementById('messages');

            const tousLesChronos = document.querySelectorAll('.chrono-player');
            tousLesChronos.forEach(c => c.classList.remove('active-turn'));
            const divActive = document.getElementById(`chrono-${idJoueurActif}`);
            if (divActive) divActive.classList.add('active-turn');

            if (socket.id === idJoueurActif) {
                inputReponse.disabled = false;
                btnValider.disabled = false;
                btnSkip.disabled = false;
                inputReponse.value = "";
                inputReponse.focus();
                transmettreFrappe();
                msg.innerText = "À TOI DE JOUER !";
                msg.style.color = "#2196F3";
            } else {
                inputReponse.disabled = true;
                btnValider.disabled = true;
                btnSkip.disabled = true;
                inputReponse.value = "";
                msg.innerText = "C'est au tour de l'adversaire...";
                msg.style.color = "#f44336";
            }
        });

        socket.on('nouvelle_question', (data) => {
            const { question, theme, difficulte } = data;

            document.getElementById('texte-question').innerText = `${question}`;

            document.getElementById('question-info').style.display = 'block';
            document.getElementById('badge-theme').innerText = theme || "Général";

            const badgeDiff = document.getElementById('badge-difficulte');
            badgeDiff.innerText = difficulte || "Normal";

            badgeDiff.className = 'badge';
            if (difficulte === "Facile") badgeDiff.classList.add('diff-facile');
            else if (difficulte === "Moyen") badgeDiff.classList.add('diff-moyen');
            else if (difficulte === "Difficile") badgeDiff.classList.add('diff-difficile');
            else badgeDiff.classList.add('diff-moyen');
        });

        socket.on('frappe_adversaire', (data) => {
            const divVision = document.getElementById('vision-adversaire');
            if (data.texte === "") {
                divVision.innerHTML = `<em>${data.pseudo} réfléchit...</em>`;
            } else {
                divVision.innerHTML = `<strong>${data.pseudo} tape :</strong> ${data.texte}`;
            }
        });

        socket.on('bonne_reponse', (msg) => {
            const feed = document.getElementById('feedback-reponse');
            feed.style.color = "#4CAF50";
            feed.innerText = msg;
            document.getElementById('vision-adversaire').innerHTML = `<em>Prépare-toi...</em>`;
        });

        socket.on('mauvaise_reponse', (msg) => {
            const feed = document.getElementById('feedback-reponse');
            feed.style.color = "#f44336";
            feed.innerText = msg;
        });

        socket.on('fin_partie', (msg) => {
            document.getElementById('interface-jeu').style.display = 'none';
            document.getElementById('vision-adversaire').style.display = 'none';

            const mess = document.getElementById('messages');
            mess.innerText = "GAME OVER";
            mess.style.color = "#f44336";
            mess.style.fontSize = "2rem";

            alert(msg);
        });
    </script>
</body>

</html>
